name: CI

# 触发时机：推 main / 提 PR / 手动。
# verify = 门禁（类型检查 + 自检 + 前端构建）；desktop = 产出 Windows 安装包；
# docker = 校验镜像可构建。三者都只构建不发布 —— 发版仍由维护者手动执行
# （见 CONTRIBUTING.md）。安装包从 Actions 的 artifacts 里下载。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支有新提交时取消上一轮，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 门禁（typecheck + selfcheck + 前端构建）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        # 用 npm ci 而非 npm install：lock 文件一致性只有 CI 能真正验出来
        # （历史教训：bump 工具曾把 package-lock.json 的依赖版本改坏，
        #   本地 tsc + selfcheck 全绿，只有 CI 的 npm ci 会报 EUSAGE）
        run: npm ci

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: 项目自检
        run: npm test

      - name: 前端构建（桌面产物）
        run: npm run build:web

      - name: 前端构建（Web/Docker 产物）
        run: npm run build:web:docker

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: src/web/dist/
          retention-days: 7
          if-no-files-found: warn

  desktop:
    name: Windows 桌面安装包（NSIS）
    runs-on: windows-latest
    timeout-minutes: 45
    # PR 不打包：安装包要下载 Electron / NSIS / winCodeSign 资源，耗时较长，
    # 门禁交给 verify 就够了；推 main 与手动触发才产出可下载的安装包。
    if: github.event_name != 'pull_request'
    needs: verify

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 桌面渲染产物输出到 gui-react/（vite.config.ts 的 outDir），electron-main
      # 在打包后直接读 gui-react/index.html —— 不先构建就会退回到旧版原生界面。
      - name: 前端构建（桌面产物）
        run: npm run build:web

      - name: 打包 Windows 安装包
        # 用原生 windows-latest：此前在 Linux 上打 NSIS 目标需要 wine，问题较多。
        # 产物名由 package.json 的 artifactName 决定（MS-Rewards-Auto-Setup-${buildVersion}.exe）。
        run: npm run pack

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: MS-Rewards-Auto-Setup
          # blockmap 与 latest.yml 是 electron-builder 的增量更新元数据，
          # 发 Release 时正文要写它们的 SHA256，所以一起带上。
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          retention-days: 14
          # 找不到 exe 直接判失败：静默跳过会让「打包其实早坏了」一直没人发现
          if-no-files-found: error

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 与 verify 串行：Docker 构建吃满 CPU，并发跑会拖慢彼此
    needs: verify

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 Docker 镜像
        # 只构建不推送：推送需要 ghcr 凭据，且发版节奏由维护者控制
        run: docker build -f docker/Dockerfile -t ms-rewards-auto:ci .
