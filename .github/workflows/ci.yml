name: CI

# 触发时机：推 main / 提 PR / 手动 / 推 vX.Y.Z tag。
# verify = 门禁（类型检查 + 自检 + 前端构建）；desktop = 产出 Windows 安装包；
# docker = 构建镜像并推送 ghcr（版本 tag + latest，供 Watchtower 自动更新）。
#安装包平时从 Actions 的 artifacts 里下载（保留 14 天）；
# 推版本 tag 时 desktop 会额外建一个**草稿 Release** 并挂上安装包，
# 维护者核对字节数/SHA256 后点 publish —— 见 CONTRIBUTING.md。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支有新提交时取消上一轮，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 门禁（typecheck + selfcheck + 前端构建）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 最小权限：门禁只读代码 + 上传产物，不需要任何写权限
    # （CodeQL actions/missing-workflow-permissions）
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        # 用 npm ci 而非 npm install：lock 文件一致性只有 CI 能真正验出来
        # （历史教训：bump 工具曾把 package-lock.json 的依赖版本改坏，
        #   本地 tsc + selfcheck 全绿，只有 CI 的 npm ci 会报 EUSAGE）
        run: npm ci

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: 项目自检
        run: npm test

      - name: 前端构建（桌面产物）
        run: npm run build:web

      - name: 前端构建（Web/Docker 产物）
        run: npm run build:web:docker

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: src/web/dist/
          retention-days: 7
          if-no-files-found: warn

  desktop:
    name: Windows 桌面安装包（NSIS）
    runs-on: windows-latest
    timeout-minutes: 45
    # 最小权限：这个 job 只打包 + 传 artifact，不碰 Release → contents: read 足够
    permissions:
      contents: read
    # PR 不打包：安装包要下载 Electron / NSIS / winCodeSign 资源，耗时较长，
    # 门禁交给 verify 就够了；推 main、推 tag 与手动触发才产出安装包。
    if: github.event_name != 'pull_request'
    needs: verify

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 桌面渲染产物输出到 gui-react/（vite.config.ts 的 outDir），electron-main
      # 在打包后直接读 gui-react/index.html —— 不先构建就会退回到旧版原生界面。
      - name: 前端构建（桌面产物）
        run: npm run build:web

      - name: 打包 Windows 安装包
        # 用原生 windows-latest：此前在 Linux 上打 NSIS 目标需要 wine，问题较多。
        # 产物名由 package.json 的 artifactName 决定（MS-Rewards-Auto-Setup-${buildVersion}.exe）。
        run: npm run pack

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: MS-Rewards-Auto-Setup
          # blockmap 是 electron-builder 的增量更新元数据，发 Release 时正文要写它的
          # SHA256，所以一起带上。latest.yml 只在配了 publish 字段时才生成
          # （本项目 publish=null，所以实际没有这个文件，故用 warn 而非 error）。
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          retention-days: 14
          # 找不到 exe 直接判失败：静默跳过会让「打包其实早坏了」一直没人发现
          if-no-files-found: error


  release:
    name: 自动建草稿 Release（仅版本tag）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 只有这个 job 需要写权限（建 Release）。desktop / verify 仍是 read ——
    # 拆成独立 job 就是为了「推 main 时没人持有写权限」。
    permissions:
      contents: write
    # 仅版本 tag：推 main 只更新 artifact，不碰 Release。
    # 草稿而非直接发布 —— 维护者核对字节数/SHA256 后点publish，人工这关不能丢。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop

    steps:
      # 复用 desktop 已打的包，不再重复 pack（省一次 5 分钟构建）。
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: MS-Rewards-Auto-Setup
          path: dist

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 计算安装包 SHA256
        id: sha
        shell: pwsh
        run: |
          # 按版本号精确匹配而不是「取第一个 exe」：本机 dist/ 会堆积历史产物
          # （实测能到 13 个），取第一个很可能把旧包挂到 Release 上。
          # 产物名规则：MS-Rewards-Auto-Setup-<version>.<buildNumber>.exe
          $ver = node -p "require('./package.json').version"
          $exe = Get-ChildItem "dist/MS-Rewards-Auto-Setup-$ver.*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $bm  = Get-ChildItem "dist/MS-Rewards-Auto-Setup-$ver.*.blockmap" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "dist 里找不到版本 $ver 的安装包（打包异常）" }
          "ver=$ver"                | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8
          "exename=$($exe.Name)"    | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8
          "exebytes=$($exe.Length)" | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8
          "exesha=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower())" | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8
          if ($bm) {
            "bmname=$($bm.Name)"    | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8
            "bmbytes=$($bm.Length)" | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8
            "bmsha=$((Get-FileHash $bm.FullName -Algorithm SHA256).Hash.ToLower())" | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8
          }

      - name: 渲染发布说明（替换占位符）
        id: notes
        shell: pwsh
        env:
          EXE_SHA: ${{ steps.sha.outputs.exesha }}
          EXE_BYTES: ${{ steps.sha.outputs.exebytes }}
          EXE_NAME: ${{ steps.sha.outputs.exename }}
          BM_SHA: ${{ steps.sha.outputs.bmsha }}
          BM_BYTES: ${{ steps.sha.outputs.bmbytes }}
          BM_NAME: ${{ steps.sha.outputs.bmname }}
          VER: ${{ steps.sha.outputs.ver }}
        run: |
          # 说明正文放release-notes/<版本>.md；缺失则退回骨架，
          # **不因缺文件而失败** —— 发版不该被一个可选文件卡住。
          $f = "release-notes/$env:VER.md"
          if (Test-Path $f) {
            $body = Get-Content $f -Raw -Encoding utf8
          } else {
            $body = "# $env:VER`n`n> 自动生成 —— 未找到 release-notes/$env:VER.md，补正文后重推tag 可覆盖"
            "⚠️ 未找到 $f，已用骨架说明" | Write-Output
          }
          # 占位符全量替换（PowerShell 的 .Replace 换全部出现处，非仅首个）
          $body = $body.Replace('{{VERSION}}', $env:VER).
                        .Replace('{{SHA256_EXE}}', $env:EXE_SHA).
                        .Replace('{{BYTES_EXE}}', $env:EXE_BYTES).
                        .Replace('{{EXE_NAME}}', $env:EXE_NAME).
                        .Replace('{{SHA256_BLOCKMAP}}', $env:BM_SHA).
                        .Replace('{{BYTES_BLOCKMAP}}', $env:BM_BYTES).
                        .Replace('{{BLOCKMAP_NAME}}', $env:BM_NAME)

          # ⚠️ 替换后必须自查还有没有残留占位符（2026-10-07 踩到）。
          # v0.14.9 线上正文里SHA256 全是 `{{SHA256_EXE}}` 字面量 —— 上一步的
          # $env:EXE_SHA 等变量为空（steps.sha.outputs 没传过来 / 上游 job 失败
          # 后仍在跑），.Replace 把占位符替换成了**空串**或原样保留，而整条流水线
          # 一路绿灯，没有任何一处会喊「产物表是空的」。
          # 这里显式断言：正文里不允许再出现任何 {{占位符}}，出现即失败，
          # 让「产物表缺值」在发版这一步就红，而不是等用户校验哈希才发现。
          $left = [regex]::Matches($body, '\{\{[A-Za-z_0-9]+\}\}')
          if ($left.Count -gt 0) {
            $names = ($left | ForEach-Object { $_.Value } | Sort-Object -Unique) -join ', '
            throw "发布说明里仍有未替换的占位符：$names —— 检查 steps.sha.outputs 是否为空（dist 里有没有匹配版本号的 exe）"
          }
          foreach ($pair in @(@('EXE_SHA','SHA256_EXE'), @('EXE_BYTES','BYTES_EXE'),
                              @('EXE_NAME','EXE_NAME'), @('BM_SHA','SHA256_BLOCKMAP'),
                              @('BM_BYTES','BYTES_BLOCKMAP'), @('BM_NAME','BLOCKMAP_NAME'))) {
            if (-not $env:($pair[0])) { throw "步骤变量 $($pair[0]) 为空，对应占位符 $($pair[1]) 没被真正替换" }
          }

          $body | Out-File -FilePath release-notes-rendered.md -Encoding utf8 -NoNewline
          "path=release-notes-rendered.md" | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8

      - name: 建草稿 Release 并挂安装包
        env:
          # 内置 GITHUB_TOKEN（contents: write 已在本 job 声明），无需配置 secret。
          # tag 取自 GitHub 上下文而非用户输入，脚本里无字符串拼接进命令的注入面。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.notes.outputs.path }}
          EXE_NAME: ${{ steps.sha.outputs.exename }}
          BM_NAME: ${{ steps.sha.outputs.bmname }}
          VER: ${{ steps.sha.outputs.ver }}
        shell: pwsh
        run: |
          $assets = @("dist/$env:EXE_NAME")
          if ($env:BM_NAME) { $assets += "dist/$env:BM_NAME" }
          gh release create $env:TAG --draft --title "$env:VER" --notes-file $env:NOTES @assets
          if ($LASTEXITCODE -ne 0) {
            Write-Output "自动创建失败（tag 可能已有 Release），改为补挂："
            gh release view $env:TAG *> $null
            if ($LASTEXITCODE -ne 0) { throw "tag $env:TAG 的 Release 不存在，且自动创建失败" }
            gh release edit $env:TAG --draft=true --title "$env:VER" --notes-file $env:NOTES
            gh release upload $env:TAG @assets --clobber
          }
          Write-Output "草稿 Release 已就绪：$env:TAG —— 请核对字节数/SHA256 后点 publish"

  docker:
    name: Docker 镜像构建并推送 ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 与 verify 串行：Docker 构建吃满 CPU，并发跑会拖慢彼此
    needs: verify
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 登录 ghcr
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 构建 Docker 镜像
        run: docker build -f docker/Dockerfile -t ms-rewards-auto:ci .

      - name: 推送 ghcr（版本 tag + latest）
        # 推 main / 手动触发才推；PR 只构建校验，避免污染 latest。
        # github.repository_owner 已是小写，符合 ghcr 镜像名要求。
        if: github.event_name != 'pull_request'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IMG="ghcr.io/${{ github.repository_owner }}/ms-rewards-auto"
          docker tag ms-rewards-auto:ci "${IMG}:${VERSION}"
          docker tag ms-rewards-auto:ci "${IMG}:latest"
          docker push "${IMG}:${VERSION}"
          docker push "${IMG}:latest"
