# ---------------------------------------------------------------------------
# MS Rewards Auto · 容器内置 KasmVNC 配置
# 覆盖 deb 自带的 /etc/kasmvnc/kasmvnc.yaml（deb 装的是全注释的模板）
#
# 设计要点（踩过坑的）：
#   - 桌面分辨率 / GPU / DRInode / 网络协议全部在这文件里，**改这里比改 compose
#     环境变量优先级更高**（KasmVNC 不会从环境变量读这些，会读 yaml）。
#   - 不能用 require_ssl=true（容器里没有 CA 签的证书），用 ssl 关闭 → 走 HTTP 6080。
#   - 浏览器 WebP 解码 + 多线程编码 + DRI3 GPU 加速是 KasmVNC 默认就开的，不用手动改。
#   - DRI 节点在容器内是 /dev/dri/renderD128（NAS 上裸核 PCI/Intel/AMD 核显的标准路径）。
#     没有时也没事：KasmVNC 静默回退 CPU 软光栅，DRI3 失效但不会崩。
# ---------------------------------------------------------------------------
---
desktop:
  resolution:
    # 1920×1080：之前 Xvfb + noVNC 路径因为 JS 解码器扛不住被迫降到 1440×900。
    # KasmVNC 浏览器原生 WebP 解码，可以放回去了。
    width: 1920
    height: 1080
  allow_resize: true
  pixel_depth: 24
  gpu:
    hw3d: false
    drinode: /dev/dri/renderD128

network:
  protocol: http
  interface: 0.0.0.0
  websocket_port: 6080
  use_ipv4: true
  use_ipv6: true
  ssl:
    require_ssl: false   # 容器里没有 CA 证书，关掉走明文 6080

user_session:
  new_session_disconnects_existing_exclusive_session: false
  concurrent_connections_prompt: false

pointer:
  enabled: true
  game_mode: false

runtime_configuration:
  allow_client_to_override_kasm_server_settings: true

logging:
  # 踩坑：这三个键必须「全有或全无」。只写 level:30 时包装器判定 config errors 直接退出。
  # 实测 defaults.yaml 的值就是 all / logfile / 30，照抄即可。
  log_writer_name: all
  log_dest: logfile
  level: 30

encoding:
  # 软编码缓解（2026-09-24 重新启用视频模式时同步下调）：服务器是 VM（Virtio GPU，
  # 无真实 VAAPI 硬编），容器 6 核 CPU 跑 openh264。60fps 1080p 软编必然掉帧，
  # 降到 30fps 把编码负载减半；无损分块模式（日常控制页面）30fps 也完全够用。
  max_frame_rate: 30
  rect_encoding_mode:
    rectangle_compress_threads: auto
  # 历史：默认视频编码模式（面积≥45% 持续 5s 触发）曾导致软编码白块卡屏，
  # 一度按 Extreme 预设「有效禁用」（100%/100s）。但部分浏览器对无损分块链路的
  # WebP/QOI（WASM 解码器受 COEP 头影响）渲染异常，而视频模式走 H.264/WebCodecs
  # 是浏览器兼容性最好的路径（Chrome/Edge 94+、Safari 16.4+、Firefox 130+）。
  # 折中：重新启用但**收紧触发**——面积 70% + 持续 8s，只有整屏剧烈变化（视频播放、
  # 大面积滚动）才进视频模式，日常控制页面仍走无损分块；配合上面 30fps 上限与
  # 显式 h264（h265/av1 软编更慢且浏览器支持面窄，不用）。
  video_encoding_mode:
    enter_video_encoding_mode:
      area_threshold: 70%
      time_threshold: 8
    exit_video_encoding_mode:
      time_threshold: 3
  video_streaming_mode:
    codec: h264

server:
  http:
    httpd_directory: /usr/share/kasmvnc/www
    headers:
      - Cross-Origin-Embedder-Policy=require-corp
      - Cross-Origin-Opener-Policy=same-origin
  advanced:
    kasm_password_file: /home/node/.kasmpasswd