# ===========================================================================
# MS Rewards Auto · Docker 版
#
# 方式一（推荐）：直接拉取预构建镜像，不需要源码
#     docker compose -f docker/docker-compose.yml pull
#     docker compose -f docker/docker-compose.yml up -d
#
# 方式二：本地构建（改源码 / 自定义构建参数时用）
#     docker compose -f docker/docker-compose.yml up -d --build
#
# 打开：http://<服务器IP>:25560
#   首次访问进入安装向导 → 设置保险库密码 → 保存恢复密钥到浏览器
#   之后每次打开浏览器点「使用本机保存的数字密钥登录」即可
#
# 浏览器说明：镜像内已预装环境拟真浏览器（/opt/fingerprint-chromium），
#   Docker 版默认且只用它，运行时不会再去下载 134MB。
#
# 国内加速（可选）：
#   拉基础镜像慢 → /etc/docker/daemon.json 加 "registry-mirrors": ["https://docker.1ms.run"]
#   拉本镜像慢   → 把 image: 换成 ghcr.1ms.run/zefeng1236/ms-rewards-auto:0.13.14
#   （两者可同时用；改完 systemctl daemon-reload && systemctl restart docker）
# ===========================================================================

services:
  ms-rewards:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # npm 与 Debian 源，默认国内；海外环境可改成官方地址
        # DEBIAN_MIRROR 是实测选出来的：按 chromium 真实 deb 采样（MB/s）
        #   南大 35.8 > 清华 26.2 > 北外 9.3 > 中科大 7.0 > 华为 6.0 > 腾讯 1.9
        # （阿里云当时 10.6，原默认值，已换掉；换源只影响首次构建）
        NPM_REGISTRY: https://registry.npmmirror.com
        DEBIAN_MIRROR: https://mirror.nju.edu.cn/debian
    # 镜像名与 Dockerfile 里预装的内容一一对应：
    #   - 直接拉取（推荐，无需源码）：docker compose pull && docker compose up -d
    #   - 本地构建：docker compose up -d --build
    # ghcr 国内加速：把下面的镜像地址换成 ghcr.1ms.run/zefeng1236/ms-rewards-auto:0.13.14
    image: ghcr.io/zefeng1236/ms-rewards-auto:0.13.14
    container_name: ms-rewards
    restart: unless-stopped

    ports:
      # 服务端口固定 25560（3000 太常见易冲突）；只改左边即可换宿主端口
      - "25560:25560"
      # 内置 noVNC（MS_REWARDS_ENABLE_NOVNC=1 时才真的拉起）：http://<服务器IP>:6080
      - "6080:6080"

    environment:
      # ---------- 时区（很重要）----------
      # 每日定时按容器时区计算，务必与你所在时区一致
      TZ: Asia/Shanghai

      # ---------- 存储 ----------
      MS_REWARDS_STORAGE_DIR: /data/storage

      # ---------- 保险库 ----------
      # 推荐留空：在 Web 安装向导里设密码，并在浏览器保存数字密钥。
      # 想完全无人值守（重启后不手动解锁）才填下面其中一个：
      #   MS_REWARDS_VAULT_PASSWORD: ""
      #   MS_REWARDS_VAULT_KEY: ""

      # ---------- 浏览器 ----------
      # Docker 版默认且只用「环境拟真浏览器」：已在镜像内预装（/opt/fingerprint-chromium），
      # 运行时不再下载。容器内非 root 运行，必须带 --no-sandbox。
      # （普通 Chromium 已从镜像移除——sec-ch-ua / Client Hints 改不动，留环境特征矛盾，见 Dockerfile）
      # --disable-gpu-sandbox 是必需的：容器里 GPU 进程默认起不来，WebGL 会整个不可用
      # （GL_VENDOR = Disabled / BindToCurrentSequence failed），而"桌面浏览器没有 WebGL"
      # 是最顶级的机器人特征。⚠️ 千万不要换成 --disable-gpu，那会让 WebGL 永久不可用。
      MS_REWARDS_CHROMIUM_ARGS: "--no-sandbox,--disable-dev-shm-usage,--disable-gpu-sandbox"

      MS_REWARDS_PORT: "25560"

      # ---------- TLS（Passkey 必需）----------
      # auto = 首次启动自签证书（存 storage/tls/），25560 走 https。
      # 浏览器首次访问弹证书警告，点「继续前往」即可。置 off 回退明文 http
      # （此时 Passkey 登录按钮会置灰提示需 HTTPS）。
      MS_REWARDS_TLS: "auto"

      # ---------- 重启后自动解锁（无人值守）----------
      # 1 = 解锁成功后把凭据写入 storage/vault-autounlock.key（600），
      # 容器重启后守护进程自己解锁、定时任务照常跑；管理面仍要登录。
      MS_REWARDS_VAULT_AUTOUNLOCK_FILE: "1"

      # ---------- 图形转发（内置 KasmVNC，手动授权登录用）----------
      # KasmVNC = X server + VNC server + Web UI 三合一（比之前的 Xvfb +
      # x11vnc + websockify + noVNC 四件套少一层 X11 协议传输），浏览器原生
      # WebP 解码（不再是 noVNC 的纯 JS 解码），并可走 DRI3 GPU 加速
      # （NAS 上的 AMD/Intel 核显）。
      # 置 0 即完全不拉起（同时可删掉上面 6080 的映射）。
      MS_REWARDS_ENABLE_NOVNC: "1"
      DISPLAY: ":1"
      DISPLAY_WIDTH: 1920
      DISPLAY_HEIGHT: 1080
      # KasmVNC 登录凭据：留空则首次启动随机生成，并写入
      # ../storage/kasm-credentials.txt（权限 600），从该文件读取用户名和密码。
      # NAS 需要固定凭据时可取消注释并改成自己的值。
      # MS_REWARDS_KASM_USER: msrewards
      # MS_REWARDS_KASM_PASSWORD: "change-this-password"
      #
      # 免登录：置 1 关掉 6080 的登录框，浏览器打开直接进桌面。
      # ⚠️ 仅可信内网使用——关掉后任何能访问 6080 的人都能直接操作你的账号。
      #   （即使免登录，密码文件仍会保留一个用户，因为包装器硬性要求至少一个用户存在）
      MS_REWARDS_KASM_NO_AUTH: "1"

    volumes:
      # 账户配置、登录态、保险库、日志 —— 全部在这里，容器重建不丢
      - ../storage:/data/storage

    # GPU 加速（可选，NAS 上建议开）：宿主有 AMD/Intel 核显或独显时取消注释，
    # 容器内 KasmVNC 走 VAAPI 硬解（DRI3）。⚠️ 没有 /dev/dri 的宿主不要开，
    # 否则容器会因设备映射失败而起不来。
    # devices:
    #   - /dev/dri:/dev/dri

    # Chromium 共享内存，不加容易在大页面崩溃
    shm_size: "1gb"

    # 可选资源限制
    # mem_limit: 1g
    # cpus: 1.5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://127.0.0.1:25560/api/health',{rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3

# ---------------------------------------------------------------------------
# 首次授权登录辅助（仅需要MS OAuth 手动登录时）
#   noVNC 已内置在 ms-rewards 容器里，随服务一起启动（MS_REWARDS_ENABLE_NOVNC=1）：
#   浏览器打开 http://<服务器IP>:6080 → 在里面完成MS登录
#   然后：docker exec -it ms-rewards node src/main.js login 1
#   不需要就把它置 0 并删掉 6080 映射，图形栈完全不会拉起。
#
# 这里不再有独立的 novnc 容器：跨容器 X11 只能走 TCP 且共享内存失效，
# 1080p 下每帧 8.3MB 原始像素过网络，鼠标卡到没法用（详见 docker/novnc-stack.sh）。
# ---------------------------------------------------------------------------
