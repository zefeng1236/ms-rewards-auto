# ===========================================================================
# MS Rewards Auto · Docker 版
#
# 一键启动（在项目根目录执行）：
#     docker compose -f docker/docker-compose.yml up -d --build
#
# 打开：http://<服务器IP>:25560
#   首次访问进入安装向导 → 设置保险库密码 → 保存恢复密钥到浏览器
#   之后每次打开浏览器点「使用本机保存的数字密钥登录」即可
#
# 国内加速（可选）：拉取基础镜像慢时，在 /etc/docker/daemon.json 加
#     "registry-mirrors": ["https://docker.1ms.run"]
# 然后 systemctl daemon-reload && systemctl restart docker
# ===========================================================================

services:
  ms-rewards:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # npm 与 Debian 源，默认国内；海外环境可改成官方地址
        NPM_REGISTRY: https://registry.npmmirror.com
        DEBIAN_MIRROR: https://mirrors.aliyun.com/debian
    image: ms-rewards-auto:0.9.4
    container_name: ms-rewards
    restart: unless-stopped

    ports:
      # 服务端口固定 25560（3000 太常见易冲突）；只改左边即可换宿主端口
      - "25560:25560"

    environment:
      # ---------- 时区（很重要）----------
      # 每日定时按容器时区计算，务必与你所在时区一致
      TZ: Asia/Shanghai

      # ---------- 存储 ----------
      MS_REWARDS_STORAGE_DIR: /data/storage

      # ---------- 保险库 ----------
      # 推荐留空：在 Web 安装向导里设密码，并在浏览器保存数字密钥。
      # 想完全无人值守（重启后不手动解锁）才填下面其中一个：
      #   MS_REWARDS_VAULT_PASSWORD: ""
      #   MS_REWARDS_VAULT_KEY: ""

      # ---------- Chromium ----------
      # 镜像内已 apt 安装；容器内非 root 运行，必须带 --no-sandbox
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      MS_REWARDS_CHROMIUM_ARGS: "--no-sandbox,--disable-dev-shm-usage,--disable-gpu"

      MS_REWARDS_PORT: "25560"

      # ---------- 图形转发（配合 --profile login 的 noVNC）----------
      # 「去登录」弹出的微软授权窗口会渲染到 noVNC 容器的 X 服务上，
      # 在 http://<服务器IP>:6080 里可见可操作；noVNC 未启动时该项无副作用
      DISPLAY: "ms-rewards-novnc:0"

    volumes:
      # 账户配置、登录态、保险库、日志 —— 全部在这里，容器重建不丢
      - ../storage:/data/storage

    # Chromium 共享内存，不加容易在大页面崩溃
    shm_size: "1gb"

    # 可选资源限制
    # mem_limit: 1g
    # cpus: 1.5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:25560/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3

# ---------------------------------------------------------------------------
# 首次授权登录辅助（仅需要微软 OAuth 手动登录时启用）
#   docker compose -f docker/docker-compose.yml --profile login up -d
#   浏览器打开 http://<服务器IP>:6080 → 在里面完成微软登录
#   然后：docker exec -it ms-rewards node src/main.js login 1
#   用完：docker compose -f docker/docker-compose.yml --profile login stop
# ---------------------------------------------------------------------------
  novnc:
    profiles: ["login"]
    image: theasp/novnc:latest
    container_name: ms-rewards-novnc
    restart: unless-stopped
    environment:
      DISPLAY_WIDTH: 1280
      DISPLAY_HEIGHT: 800
      RUN_XTERM: "no"
    ports:
      - "6080:8080"
    depends_on:
      - ms-rewards
